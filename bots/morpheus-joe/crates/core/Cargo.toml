[package]
name = "morpheus-joe-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

# One path dependency, inside this bot, none from crates.io. The dependency
# budget that `tools/vendor_probe.py` and `tools/dependency_budget.py` guard is
# about the 10,000-file unpacked sandbox cap and the offline build, and a
# sibling crate in the same workspace costs nothing against either. Measured
# (morpheus-rs-dependency-budget.md): `sha2` is 565 vendored files (5.6% of the
# cap), candle-core 3,888 (39%) — that is what a real dependency costs, and it
# is why this list has nothing else on it.
#
# `joenet` arrives at N2, when `nn::bridge` starts feeding joe's observation
# pipeline from morpheus's frames. Before that only the bot crate needed it.
[dependencies]
joenet = { path = "../joenet" }
