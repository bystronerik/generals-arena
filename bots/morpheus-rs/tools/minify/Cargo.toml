# Dev-time helper, never shipped and never linked into the bot.
#
# `tools/` is in `fingerprint._SKIP_DIRS`, so nothing here touches the bot's
# rating identity — and nothing here reaches the submission zip either. It runs
# on the packaging host, where a network exists; the judge's sandbox sees only
# the strings this produces.
#
# `[workspace]` is empty on purpose: without it, cargo walks up, finds
# `bots/morpheus-rs/Cargo.toml`, and refuses to build a crate inside a
# workspace that does not list it as a member.
[package]
name = "morpheus-rs-minify"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# Pinned exactly. This strips comments out of the program that plays rated
# games; a silent upgrade to a version whose output differs is a change to the
# submitted source that nothing here would notice.
rustminify = "=0.2.0"
# syn **1.x**, not 2. `rustminify::remove_docs` takes a `syn::File` from the
# 1.0 line, and cargo will happily link both majors into one graph — the error
# is a type mismatch between two types spelled identically.
syn = { version = "1", features = ["full", "parsing", "printing"] }
