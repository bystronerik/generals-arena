[pytest]
testpaths = tests bots
pythonpath = . bots
# Bot unit tests live under bots/<name>/tests/ (excluded from content hash).
# `replay` is excluded by default and run in the verification gate instead. It
# plays and replays a real match, which costs ~1.6 s of one-time JAX jit that
# cannot be made cheap — and the suite budget is 7 s (AGENTS.md tester §4).
# A command-line `-m` overrides this, so `pytest tests -m replay` runs it.
addopts = -m "not replay"
markers =
    slow: subprocess or JAX harness smoke (optional in quick loops)
    replay: plays and replays a real match; gate-only, `pytest tests -m replay`
