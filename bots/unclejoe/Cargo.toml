[package]
name = "unclejoe"
version = "0.1.0"
edition = "2021"
publish = false

# Empty on purpose, and a hard requirement rather than a preference: intake
# compiles one crate from source, so a dependency here is a dependency the
# judge has to fetch and build. joe-rs earned that rule the expensive way — its
# 93-crate vendored build is what tournament qualification rejected, twice —
# and this fork inherits it whole. The forked halves are src/nn/gemm.rs for the
# GEMMs, src/nn/net.rs for the graph, and src/nn/safetensors.rs with
# src/io/json.rs for the artifact. The tactics layer that this fork exists to
# carry is search over integers, so it needs nothing from crates.io either.
[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
# The judge treats a crash as a forfeit but a bad reply as one fault out of
# fifty (RULES.md §08). Unwinding lets catch_unwind turn a panicking turn
# into a pass.
panic = "unwind"
