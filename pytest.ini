[pytest]
testpaths = tests bots training/morpheus/tests training/joe/tests
pythonpath = . bots
# Bot unit tests live under bots/<name>/tests/ (excluded from content hash).
# `replay`, `morpheus`, `joe`, and `unclejoe` are excluded by default. `replay`
# plays and replays a real match (~1.6 s one-time JAX jit). `morpheus` covers
# heavyweight Morpheus gates in either language: Python model, JAX, and
# subprocess tests, and the morpheus-rs parity and selfcheck gates, which need
# a release binary the default suite cannot assume. `joe` covers the Average
# Joe pipeline (JAX import, net construction) and the joe-rs parity gates.
# `unclejoe` is the fork's wire-replay gate: a release binary plus recorded
# games, neither of which the default suite can assume. The warm default suite
# budget is 15 s (AGENTS.md tester §4). A command-line `-m` overrides this, so
# `pytest tests -m replay` or `pytest -m joe` selects those gates.
addopts = -m "not replay and not morpheus and not joe and not unclejoe"
markers =
    slow: subprocess or JAX harness smoke (optional in quick loops)
    replay: plays and replays a real match; gate-only, `pytest tests -m replay`
    morpheus: heavyweight Morpheus gate (Python or Rust): subprocess, JAX,
        model, or a morpheus-rs gate that needs a release binary
    joe: Average Joe pipeline tests (JAX import + net construction)
    unclejoe: unclejoe wire-replay gate; needs a release binary and the
        recorded games joe-rs's corpus tools produce
