[pytest]
testpaths = tests bots training/morpheus/tests
pythonpath = . bots
# Bot unit tests live under bots/<name>/tests/ (excluded from content hash).
# `replay` and `morpheus` are excluded by default. `replay` plays and replays a
# real match (~1.6 s one-time JAX jit). `morpheus` covers heavyweight Morpheus,
# subprocess, JAX, or model gates. The warm default suite budget is 7 s
# (AGENTS.md tester §4). A command-line `-m` overrides this, so
# `pytest tests -m replay` or `pytest -m morpheus` selects those gates.
addopts = -m "not replay and not morpheus"
markers =
    slow: subprocess or JAX harness smoke (optional in quick loops)
    replay: plays and replays a real match; gate-only, `pytest tests -m replay`
    morpheus: heavyweight Morpheus, subprocess, JAX, or model gate
