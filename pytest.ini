[pytest]
testpaths = tests bots training/morpheus/tests training/joe/tests
pythonpath = . bots
# Bot unit tests live under bots/<name>/tests/ (excluded from content hash).
# `replay`, `morpheus`, and `joe` are excluded by default. `replay` plays and
# replays a real match (~1.6 s one-time JAX jit). `morpheus` covers heavyweight
# Morpheus, subprocess, JAX, or model gates. `joe` covers the Average Joe
# pipeline (JAX import, net construction). The warm default suite budget is
# 12 s (AGENTS.md tester §4). A command-line `-m` overrides this, so
# `pytest tests -m replay` or `pytest -m joe` selects those gates.
addopts = -m "not replay and not morpheus and not joe"
markers =
    slow: subprocess or JAX harness smoke (optional in quick loops)
    replay: plays and replays a real match; gate-only, `pytest tests -m replay`
    morpheus: heavyweight Morpheus, subprocess, JAX, or model gate
    joe: Average Joe pipeline tests (JAX import + net construction)
