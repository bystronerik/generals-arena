[package]
name = "joe-rs"
version = "0.1.0"
edition = "2021"
publish = false

# Empty on purpose. The plan's first choice was candle (port-plan §5), and it
# never lost on latency — what killed it was intake: the 93-crate vendored
# build is the one thing tournament qualification rejected, twice, and a
# prebuilt binary was the stopgap. This is R1's bespoke fixed-shape fallback
# (port-plan §9) taken for that reason instead: src/nn/gemm.rs owns the GEMMs,
# src/nn/net.rs the graph, src/nn/safetensors.rs + src/io/json.rs the artifact — so
# the judge builds one crate from source, the way morpheus-rs always has.
# The safetensors artifact contract is identical either way.
[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
# The judge treats a crash as a forfeit but a bad reply as one fault out of
# fifty (RULES.md §08). Unwinding lets catch_unwind turn a panicking turn
# into a pass.
panic = "unwind"

# Mutation testing only (tools/mutation_check.py): fast links, same float
# semantics — Rust does not reassociate floats across opt levels.
[profile.mutation]
inherits = "release"
lto = false
codegen-units = 16
