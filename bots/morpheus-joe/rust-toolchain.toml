# Pinned to the competition sandbox's toolchain (rewrite-plan §1). The sandbox
# ships rustc/cargo 1.97 stable and has no network, so a crate that needed a
# newer compiler would fail `build.sh` with no way to fix it in place.
#
# `x86_64-unknown-linux-musl` is here for R4's fallback variant: a
# self-contained static binary, which the packaging script builds from day one
# so the fallback stays tested rather than theoretical (§9).
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
targets = ["x86_64-unknown-linux-musl"]
profile = "minimal"
