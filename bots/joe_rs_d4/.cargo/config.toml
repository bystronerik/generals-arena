# Compile target for the competition host: x86-64-v3, the floor found by the
# morpheus-rs M0 CPU probe (docs/research/measurements/morpheus-rs-cpu-probe.md).
# Scoped to the Linux targets: development happens on arm64 macOS where the
# flag is meaningless. Any hand-written SIMD must still detect features at
# runtime (port-plan §1).

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "target-feature=+crt-static"]
