# X16Z — X16 trained from zero (2026-08-28). Same network and schedule as
# X16.yaml (depth 16, 29,551,834 parameters, hot schedule, num_steps 128);
# two deliberate differences, both because this run starts from RANDOM
# init and not from a grown checkpoint:
#
# 1. NO SEEDED CHECKPOINT. X16 started from a fabricated step-0 set made
#    by scripts/joe_grow_depth.py. X16Z starts from build_network's random
#    init: do not seed R2 for this run.
# 2. FULL CURRICULUM. A from-zero net must learn the game, so the run
#    re-climbs the M.yaml distance ladder (win-gated 0.6 vs random)
#    instead of X16's single preset stage.
run_name: joe-X16Z

# ---- Environment: GeneralsEnv(mode="competition") numbers ----
# Identical to M7F4.yaml; the drift test pins these against the mode preset.
pad_to: 21                    # competition preset; with patch 3: 7x7 = 49 patch tokens
min_grid_size: 18             # each side drawn independently in [18, 21]
max_grid_size: 21
truncation: 1200              # competition draw turn (preset), not the released 1024
mountain_density_min: 0.24    # released M's flat 0.21 not adopted — preset range wins
mountain_density_max: 0.26
build_castles: true           # castles are built, not captured — 10th per-cell
                              # action, build mask, build-cost obs channel (plan §4)
deathtouch_turn: 800          # env-internal; the timestep channel carries the regime change

pool_size: 200000
reset_pool_every: 20

# ---- Curriculum ----
# M.yaml's from-scratch ladder: win-rate-gated stages (threshold 0.6,
# evaluated vs random). The final stage equals the competition preset
# (min 17, max unbounded); the drift test pins that equality.
curriculum:
  - min_generals_distance: 2
    max_generals_distance: 6
  - win_rate_threshold: 0.6
    min_generals_distance: 4
    max_generals_distance: 8
  - win_rate_threshold: 0.6
    min_generals_distance: 6
    max_generals_distance: 13
  - win_rate_threshold: 0.6
    min_generals_distance: 11
    max_generals_distance: 17
  - win_rate_threshold: 0.6
    min_generals_distance: 17
    max_generals_distance: null   # preset leaves the max unset

# ---- Network (X16 shape, random init) ----
network: history_transformer
depth: 16                     # same shape as X16.yaml: 29,551,834 params
                              # (joe-x16-pilots.md); weights from random init
embed_dim: 384
n_head: 8
ff_factor: 4
patch_size: 3

ema_decay: 0.999              # EMA is the deployment policy (paper: +~30 Elo)

# ---- Rollout ----
num_envs: 2048
num_steps: 128                # memory ceiling, see header note 2
num_iters: 100000             # from-zero horizon: a net this size needs at
                              # least 100k iterations; the budget/window can
                              # still stop the run early
minibatch_size: 2048
seed: 49                      # fresh rollout randomness for the new lineage

# ---- PPO ----
num_epochs: 1
gamma: 1.0
gae_lambda: 0.9
clip_eps: 0.2
max_grad_norm: 0.267
vf_coef: 0.5
target_kl: 0.02               # the guard on the hot schedule
adv_top_frac: 0.25

# ---- Entropy ----
# Hot restart (header note 1), rescaled to half-size iterations: joe-M's
# start/(t+1)^0.2 with start 0.05 tracks the same sample positions when
# start is multiplied by 2^0.2 -> 0.057.
ent_schedule: power_law
ent_coef_start: 0.057
ent_power: 0.2
ent_coef_min: 0.001

# ---- Learning rate ----
# Departure from the lineage schedule (decision 2026-08-30): hold the
# 1e-4 cap to iteration 10,000, not the sample-equivalent ~4,600 of
# joe-M's clip(0.5 * t^-1.1, ...) at T=256. The cap ends where
# N * t^-1.1 = 1e-4: N = 1e-4 * 10000^1.1 = 2.512. The same exponent
# then decays to ~7.9e-6 at iteration 100,000; the 5e-6 floor is never
# reached inside the horizon.
lr_schedule: power_law
lr_power_law_numerator: 2.512
lr_power_law_exponent: 1.1
lr_power_law_min: 5e-6
lr_power_law_max: 1e-4

# ---- Value loss: categorical HL-Gauss ----
value_loss: ce
num_bins: 128
v_min: -1.0
v_max: 1.0
hl_sigma: 0.04                # NOT the released config.py default 0.75

# ---- Eval / checkpoints ----
# eval_every 100 at T=128 = the lineage's 50 at T=256 (same sample
# cadence); eval_games halved to 256 to trim the measured ~17% eval
# overhead. The frozen reference is the M7F4 endpoint (step-20000 EMA),
# greedy both seats — the recruitment experiment's strength instrument.
# Seed both ref/ objects into R2 before launch (joe-gcp-train.md).
eval_every: 100
eval_games: 256
eval_ref_checkpoint: ref/joe-M7F4_ema_final.eqx
eval_ref_config: ref/config.yaml
# 250 at T=128 = the lineage's 125 at T=256: tighter than the lineage's
# 500 because a spot preemption costs everything since the last upload
# (measured the hard way, joe-x16-pilots.md).
ckpt_every: 250
save_every: 250

use_bf16: true
