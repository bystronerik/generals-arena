# Compile target for the competition host, fixed by the M0 CPU probe
# (docs/research/measurements/morpheus-rs-cpu-probe.md): x86-64-v3, the floor
# across sampled one-core Linux containers. Sampling found an AMD generation
# without AVX-512 beside two with it, so v4 would be a binary that dies on part
# of the fleet.
#
# Scoped to the Linux targets on purpose. Development happens on arm64 macOS,
# where this flag is meaningless, and a host-wide setting would silently apply
# to whatever the developer's machine happens to be.
#
# Any hand-written SIMD path must still detect features at runtime rather than
# trust this flag — the generals.bot sandbox cannot be probed, so the target is
# an informed guess about a machine nobody has measured (rewrite-plan §9, R4).

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "target-feature=+crt-static"]
