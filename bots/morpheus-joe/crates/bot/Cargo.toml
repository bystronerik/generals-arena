[package]
name = "morpheus-joe"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "morpheus-joe"
path = "src/main.rs"

# Both path dependencies, both inside this bot, neither from crates.io. The
# dependency budget that `tools/vendor_probe.py` and `tools/dependency_budget.py`
# guard is about the 10,000-file unpacked sandbox cap and the offline build, and
# a sibling crate in the same workspace costs nothing against either.
[dependencies]
morpheus-joe-core = { path = "../core" }
joenet = { path = "../joenet" }
